<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SecureRedact{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/>
        </svg>
        <span>SecureRedact</span>
      </a>
      <nav class="topbar-actions">
        <a class="icon-btn" href="https://github.com" title="Documentation" aria-label="Documentation">
          <svg viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Zm0-15.5a3 3 0 0 0-3 3h2a1 1 0 1 1 1.7.7l-1 1A2 2 0 0 0 11 13v.5h2V13c0-.3.1-.5.3-.7l1-1A3 3 0 0 0 12 6.5ZM11 16h2v2h-2v-2Z"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>PII Redaction Tool &mdash; detection is measured, not assumed.</span>
      <span class="footer-links">
        <a href="/static/style.css" tabindex="-1" aria-hidden="true" hidden></a>
        <span>Precision 0.97 &middot; Recall 0.93 &middot; F1 0.95 on the reference document</span>
      </span>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
